<script>
    /* Native App Bridge Launcher (Clean & Instant) */
    function openSetting(primary, fallback = '') {
      if (window.AndroidNative && window.AndroidNative.openSetting) {
        window.AndroidNative.openSetting(primary, fallback);
      } else {
        // Browser fallback
        window.location.href = `intent:#Intent;action=android.settings.${primary};end`;
      }
    }

    /* Flashlight Feature */
    let torchTrack = null;
    async function handleTorch() {
      const tile = document.getElementById('torchTile');
      const icon = document.getElementById('torchIcon');
      const status = document.getElementById('torchStatus');

      if (torchTrack) {
        torchTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
        torchTrack.stop(); 
        torchTrack = null;
        tile.classList.remove('active'); 
        icon.textContent = 'flashlight_off'; 
        status.textContent = 'Tap to Turn On';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};

        if (capabilities.torch) {
          await track.applyConstraints({ advanced: [{ torch: true }] });
          torchTrack = track;
          tile.classList.add('active'); 
          icon.textContent = 'flashlight_on'; 
          status.textContent = 'LED On';
        } else {
          track.stop(); 
          toggleScreenTorch();
        }
      } catch (err) { 
        toggleScreenTorch(); 
      }
    }

    function toggleScreenTorch() {
      const overlay = document.getElementById('screenFlashlight');
      overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
    }

    /* Search Filter */
    function filterSettings() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sections = document.querySelectorAll('.section-group');
      document.getElementById('quickPanelSection').style.display = query.length > 0 ? 'none' : 'block';

      sections.forEach(section => {
        let visibleCount = 0;
        section.querySelectorAll('.setting-item').forEach(item => {
          const text = item.textContent.toLowerCase();
          const match = text.includes(query);
          item.style.display = match ? 'flex' : 'none';
          if (match) visibleCount++;
        });
        section.style.display = visibleCount > 0 ? 'block' : 'none';
      });
    }
  </script>
