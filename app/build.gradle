plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hub.settings'
    compileSdk 34

    defaultConfig {
        applicationId "com.hub.settings"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
